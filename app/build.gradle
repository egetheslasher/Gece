
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gece.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gece.companion'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'io.github.its-hazratbilal:android-ai-kit-chat:1.0.0'
}
